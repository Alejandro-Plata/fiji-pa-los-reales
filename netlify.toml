# Dirección anterior (fiji-pa-los-reales.netlify.app). La web oficial está en Vercel.
# Netlify solo sirve descargas/version.json para que las apps instaladas con versiones ≤ 1.1.2
# (que consultan aquí) encuentren la actualización; todo lo demás redirige a Vercel (_redirects).
# Lo despliega scripts/publicar.mjs; no conectar despliegues automáticos desde GitHub.
[build]
  publish = "."

[[headers]]
  for = "/descargas/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"
